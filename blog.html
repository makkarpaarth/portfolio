<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Paarth Makkar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<canvas id="bg-curve"></canvas>

<header class="nav">
  <div class="nav__logo" aria-label="Paarth Makkar logo">
    <span class="nav__logo-mark" aria-hidden="true">Paarth</span>
  </div>
  <nav class="nav__links">
    <a href="index.html#work">Experience</a>
    <a href="index.html#exams">Exams</a>
    <a href="index.html#modelling">Modelling</a>
    <a href="blog.html">Blog</a>
    <a href="index.html#contact">Contact</a>
    <a class="nav__linkedin" href="https://www.linkedin.com/in/paarthmakkar" target="_blank" rel="noopener noreferrer" aria-label="Visit Paarth Makkar on LinkedIn">LinkedIn</a>
  </nav>
</header>

<main>
  <section class="blog blog--page" id="blog">
    <h2 class="section-title">Blog</h2>
    <form class="blog__composer" id="blog-form">
      <input type="text" id="blog-title" placeholder="Title" required>
      <textarea id="blog-body" placeholder="Write something about actuarial work, models, or exams…" required></textarea>
      <button type="submit" class="btn btn--primary">Post</button>
    </form>
    <div class="blog__list" id="blog-list"></div>
  </section>
</main>

<footer class="footer">© <span id="year"></span> Paarth Makkar — built for the actuarial market.</footer>

<script src="blog.js"></script>
</body>
</html>
